<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500;700&display=swap');
#semicircle-hand-motion { width:100%; padding:12px 0; }
#semicircle-hand-motion * { box-sizing:border-box; }
#semicircle-hand-motion .arc-phone { --arc-paper:#f3ead3; --arc-ink:#222b25; width:100%; max-width:390px; margin:0 auto; overflow:hidden; border-radius:14px; background:#263832; color:var(--arc-ink); box-shadow:0 10px 25px #0002; font:14px/1.55 'Noto Serif Thai',serif; }
#semicircle-hand-motion .arc-heading { height:58px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:var(--arc-paper); }
#semicircle-hand-motion .arc-heading strong { font-size:18px; font-weight:700; }
#semicircle-hand-motion .arc-stage { height:305px; position:relative; overflow:hidden; touch-action:pan-y pinch-zoom; user-select:none; }
#semicircle-hand-motion .arc-card { position:absolute; left:0; top:0; width:128px; height:184px; padding:4px; border:0; border-radius:9px; background:#477349; color:var(--arc-ink); box-shadow:0 2px #c8b99b,0 7px 10px #0005; font:inherit; transform-origin:50% 100%; touch-action:pan-y pinch-zoom; }
#semicircle-hand-motion .arc-card.contraband { background:#8f2a20; }
#semicircle-hand-motion .arc-card[aria-pressed="true"] { box-shadow:0 0 0 2px #d6a642,0 10px 15px #0006; }
#semicircle-hand-motion .arc-face { display:flex; flex-direction:column; align-items:center; height:100%; padding:34px 5px 6px; border-radius:6px; background:repeating-linear-gradient(82deg,#ccb98f18 0 1px,transparent 1px 3px),var(--arc-paper); pointer-events:none; }
#semicircle-hand-motion .arc-corner { position:absolute; top:9px; left:9px; display:flex; align-items:center; gap:5px; }
#semicircle-hand-motion .arc-value { width:24px; height:24px; display:grid; place-items:center; border:1px dotted #886e43; border-radius:50%; background:#ecd49f; font-weight:700; }
#semicircle-hand-motion .arc-corner img { width:18px; height:18px; }
#semicircle-hand-motion .arc-art { width:64px; height:64px; object-fit:contain; }
#semicircle-hand-motion .arc-name { font-weight:700; margin-top:5px; white-space:nowrap; }
#semicircle-hand-motion .arc-kind { font-size:11px; margin-top:2px; color:#625a45; }
#semicircle-hand-motion .arc-check { margin-top:auto; font-size:12px; }
#semicircle-hand-motion .arc-footer { min-height:113px; padding:8px 12px; background:var(--arc-paper); }
#semicircle-hand-motion .arc-dots { display:flex; justify-content:center; gap:5px; height:8px; margin:0 0 6px; }
#semicircle-hand-motion .arc-dots span { width:17px; height:3px; border-radius:2px; background:#b9ac8e; }
#semicircle-hand-motion .arc-dots span.active { background:#38623e; }
#semicircle-hand-motion .arc-detail { min-height:22px; text-align:center; font-size:13px; }
#semicircle-hand-motion .arc-controls { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:5px; font-size:12px; }
#semicircle-hand-motion .arc-controls button { width:44px; height:44px; border:1px solid #ad9b73; border-radius:6px; background:#fff9e8; color:var(--arc-ink); font-size:24px; }
#semicircle-hand-motion .arc-controls button:disabled { opacity:.35; }
</style>

    stage.append(card);return card;
  });
  function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{handMotion:'semicircle'},privateContent:{focus,selected:[...selected]}}).catch(()=>{});}
  function render(){
    const width=stage.clientWidth;if(!width)return;const radius=315,pivotY=242+radius,nearest=Math.round(focus);
    cards.forEach((card,i)=>{
      const angle=(i-focus)*settings.spacing,theta=angle*Math.PI/180;
      const distance=radius+(selected.has(i)?26:0),x=width/2+Math.sin(theta)*distance,y=pivotY-Math.cos(theta)*distance;
      card.style.transform=`translate3d(${x-64}px,${y-184}px,0) rotate(${angle}deg)`;
      card.style.zIndex=String((selected.has(i)?20:0)+10-Math.round(Math.abs(i-focus)*2));
      card.setAttribute('aria-pressed',String(selected.has(i)));card.querySelector('.arc-check').textContent=selected.has(i)?'✓ เลือกแล้ว':'เลือกไพ่';
    });
    Array.from(dots.children).forEach((dot,i)=>dot.classList.toggle('active',i===nearest));
    root.querySelector('.arc-count').textContent=`เลือก ${selected.size} / 5 ใบ`;
    root.querySelector('.arc-detail').textContent=`กำลังดู ${goods[nearest].name} · ใบที่ ${nearest+1} / 6`;
    root.querySelector('[data-direction="-1"]').disabled=focus<.01;
    root.querySelector('[data-direction="1"]').disabled=focus>4.99;
  }
  function settle(target){
    cancelAnimationFrame(animation);target=clamp(target);const start=focus,startTime=performance.now();
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){focus=target;render();save();return;}
    function frame(time){const t=Math.min(1,(time-startTime)/settings.duration);focus=start+(target-start)*(1-Math.pow(1-t,3));render();if(t<1)animation=requestAnimationFrame(frame);else save();}
    animation=requestAnimationFrame(frame);
  }
  stage.addEventListener('pointerdown',event=>{if(event.button!==0||gesture)return;cancelAnimationFrame(animation);suppressClick=false;gesture={id:event.pointerId,x:event.clientX,y:event.clientY,focus,lastX:event.clientX,time:performance.now(),velocity:0,dragging:false};});
  stage.addEventListener('pointermove',event=>{
    if(!gesture||gesture.id!==event.pointerId)return;const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
    if(!gesture.dragging){if(Math.abs(dy)>Math.abs(dx)+6){gesture=null;return;}if(Math.abs(dx)<8)return;gesture.dragging=true;stage.setPointerCapture(event.pointerId);}
    event.preventDefault();const now=performance.now(),interval=Math.max(1,now-gesture.time);gesture.velocity=(gesture.lastX-event.clientX)/interval/80;gesture.lastX=event.clientX;gesture.time=now;focus=clamp(gesture.focus-dx/80);render();
  });
  function release(event){if(!gesture||gesture.id!==event.pointerId)return;const ending=gesture;gesture=null;if(ending.dragging){suppressClick=true;const velocity=performance.now()-ending.time>100?0:ending.velocity;settle(Math.round(focus+Math.max(-.6,Math.min(.6,velocity*100))));}if(stage.hasPointerCapture(event.pointerId))stage.releasePointerCapture(event.pointerId);}
  stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',event=>{if(gesture?.id===event.pointerId){gesture=null;settle(Math.round(focus));}});
  root.querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>{suppressClick=false;settle(Math.round(focus)+Number(button.dataset.direction));}));
  stage.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();settle(Math.round(focus)+(event.key==='ArrowRight'?1:-1));}});
  new ResizeObserver(render).observe(stage);render();
  window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.privateContent;if(!state)return;cancelAnimationFrame(animation);if(Number.isFinite(state.focus))focus=clamp(state.focus);if(Array.isArray(state.selected)){selected.clear();state.selected.filter(i=>Number.isInteger(i)&&i>=0&&i<6).slice(0,5).forEach(i=>selected.add(i));}render();});
  if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:render});tweak.addSlider(settings,'spacing',{label:'องศาระหว่างไพ่',min:8,max:16,unit:'°'});tweak.addSlider(settings,'duration',{label:'จังหวะหยุด',min:200,max:500,step:25,unit:'ms'});}
})();
</script>
