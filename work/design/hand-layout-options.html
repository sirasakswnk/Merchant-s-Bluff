  const states={};
  root.querySelectorAll('.merchant-demo').forEach(demo=>{
    const viewport=demo.querySelector('.demo-window'),hand=demo.querySelector('.demo-hand'),layout=demo.dataset.layout;
    const saved=window.openai?.widgetState?.privateContent?.hands?.[layout];
    const validIds=ids=>Array.isArray(ids)?ids.filter(i=>Number.isInteger(i)&&i>=0&&i<6).slice(0,5):[];
    const selected=new Set(validIds(saved?.selected));let viewed=Number.isInteger(saved?.viewed)&&saved.viewed>=0&&saved.viewed<6?saved.viewed:2,initialized=false,pending=false;
    states[layout]=()=>({selected:[...selected],viewed});
    const settings={spread:layout==='compact'?44:88,curve:layout==='compact'?14:12};
    const position=demo.querySelector('.demo-position');
    for(let i=0;i<6;i++){const dot=document.createElement('span');position.append(dot);}
    const cards=goods.map((good,i)=>{
      const button=document.createElement('button');button.type='button';button.className='demo-card cursor-interaction'+(good.id==='crossbow'?' contraband':'');
      button.setAttribute('aria-pressed','false');button.setAttribute('aria-label',`${good.name} ใบที่ ${i+1} มูลค่า ${good.value}`);
      button.innerHTML=`<span class="demo-card-face" aria-hidden="true"><span class="demo-corner"><span class="demo-value">${good.value}</span><img src="${art[good.id]}" alt=""></span><img class="demo-art" src="${art[good.id]}" alt=""><span class="demo-name">${good.name}</span><span class="demo-kind">${good.id==='crossbow'?'ของต้องห้าม':'ถูกกฎหมาย'}</span><span class="demo-check">เลือกไพ่</span></span>`;
      button.addEventListener('click',()=>{viewed=i;if(selected.has(i))selected.delete(i);else if(selected.size<5)selected.add(i);render();if(layout!=='compact')center(i);save();});
      button.addEventListener('focus',()=>{viewed=i;if(button.matches(':focus-visible'))center(i);updateDetail();});
      hand.append(button);return button;
    });
    function save(){const api=window.openai;if(api?.setWidgetState)api.setWidgetState({modelContent:{exploringHandLayout:demo.getAttribute('aria-label')},privateContent:{hands:Object.fromEntries(Object.entries(states).map(([key,read])=>[key,read()]))}}).catch(()=>{});}
    function geometry(){const w=viewport.clientWidth;const cardWidth=layout==='compact'?112:134;const side=layout==='viewport'?(w-cardWidth)/2:40;return{w,cardWidth,side,total:5*settings.spread+cardWidth+side*2};}
    function center(i){const{w,cardWidth,side}=geometry();viewport.scrollTo({left:side+i*settings.spread+cardWidth/2-w/2,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});}
    function updateDetail(){demo.querySelector('.demo-count').textContent=`เลือก ${selected.size} / 5 ใบ`;demo.querySelector('.demo-detail').textContent=`${goods[viewed].name} · มูลค่า ${goods[viewed].value}`;}
    function render(){
      const{w,cardWidth,side,total}=geometry();if(!w)return;
      hand.style.width=`${total}px`;
      if(!initialized){viewport.scrollLeft=(total-w)/2;initialized=true;}
      cards.forEach((button,i)=>{
        let distance=layout==='viewport'?(side+i*settings.spread+cardWidth/2-viewport.scrollLeft-w/2)/(settings.spread*1.5):(i-2.5)/2.5;
        distance=Math.max(-1.3,Math.min(1.3,distance));
        const isSelected=selected.has(i),enlarge=layout==='compact'&&isSelected&&i===viewed;
        button.style.width=`${cardWidth}px`;button.style.left=`${side+i*settings.spread}px`;
        button.style.setProperty('--angle',`${enlarge?0:distance*settings.curve}deg`);
        button.style.setProperty('--rise',`${enlarge?-42:distance*distance*22-(isSelected?26:0)}px`);
        button.style.setProperty('--scale',enlarge?'1.22':'1');
        button.style.zIndex=String(enlarge||isSelected&&i===viewed?30:isSelected?10+i:i);
        button.setAttribute('aria-pressed',String(isSelected));button.querySelector('.demo-check').textContent=isSelected?'✓ เลือกแล้ว':'เลือกไพ่';
      });
      const nearest=Math.max(0,Math.min(5,Math.round((viewport.scrollLeft+w/2-side-cardWidth/2)/settings.spread)));
      Array.from(position.children).forEach((dot,i)=>dot.classList.toggle('active',i===nearest));
      demo.querySelector('[data-pan="-1"]').disabled=viewport.scrollLeft<=1;
      demo.querySelector('[data-pan="1"]').disabled=viewport.scrollLeft>=total-w-1;
      updateDetail();
    }
    viewport.addEventListener('scroll',()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render();});});
    demo.querySelectorAll('[data-pan]').forEach(button=>button.addEventListener('click',()=>{viewport.scrollBy({left:Number(button.dataset.pan)*settings.spread,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});}));
    new ResizeObserver(()=>render()).observe(viewport);render();
    window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent?.hands?.[layout];if(!next)return;selected.clear();validIds(next.selected).forEach(i=>selected.add(i));if(Number.isInteger(next.viewed)&&next.viewed>=0&&next.viewed<6)viewed=next.viewed;render();});
    if(globalThis.Tweak){const tweak=new Tweak({container:demo,onChange:render});tweak.addSlider(settings,'curve',{label:'ความโค้ง',min:4,max:18,unit:'°'});tweak.addSlider(settings,'spread',{label:'ระยะระหว่างไพ่',min:44,max:108,unit:'px'});}
  });
